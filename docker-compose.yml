name: network-gateway
services:
  # Interactive development - build and test inside the container
  gateway-dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true
    # Tests run entirely inside the container (no port exposure needed).
    # To test the gateway from the host, add:  ports: ["8080:8080", "8443:8443"]
